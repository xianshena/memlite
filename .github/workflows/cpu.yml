name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m examples.cpu_quickstart
      - run: python -m unittest discover -s tests -p test_preview_smoke.py -v
      - run: python -m unittest discover -s tests -p test_object_memory.py -v
      - run: python -m unittest discover -s tests -p test_life_environment.py -v
      - run: python -m scripts.audit_recorded_results --with-frozen-data
